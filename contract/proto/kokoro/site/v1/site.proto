// Canonical contract source owned by kokoro-system; generated clients are derived from this file.
syntax = "proto3";

package kokoro.site.v1;

message ResolveSiteByHostRequest {
  string host = 1;
  string request_id = 2;
}

message ResolveSiteByHostResponse {
  string site_id = 1;
  string key = 2;
  string canonical_host = 3;
  string default_locale = 4;
  string timezone = 5;
  uint64 generation = 6;
}

service SiteService {
  rpc ResolveSiteByHost(kokoro.site.v1.ResolveSiteByHostRequest) returns (kokoro.site.v1.ResolveSiteByHostResponse);
}
