name: kokoro-system image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kokoro_system
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kokoro_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d kokoro_system"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=30
      redis:
        image: redis:7
        ports:
          - 56379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=15
    env:
      DATABASE_URL: postgresql://postgres:kokoro_ci@127.0.0.1:55432/kokoro_system
      REDIS_URL: redis://127.0.0.1:56379
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:kokoro_ci@127.0.0.1:55432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:56379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm contract:check
      - run: pnpm test
      - run: pnpm test:schema:fresh
      - name: Build local production candidate
        id: candidate
        run: |
          docker build --tag kokoro-system:release-smoke .
          echo "image_id=$(docker image inspect kokoro-system:release-smoke --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - name: Smoke local production candidate
        run: SYSTEM_SMOKE_IMAGE=kokoro-system:release-smoke pnpm exec tsx scripts/system-runtime-smoke.ts --image
      - name: Scan production image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: kokoro-system:release-smoke
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate tested image SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: kokoro-system:release-smoke
          format: cyclonedx
          output: system-sbom.json
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Promote tested production candidate
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          TESTED_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
        run: |
          test "$(docker image inspect kokoro-system:release-smoke --format '{{.Id}}')" = "$TESTED_IMAGE_ID"
          first=""
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag kokoro-system:release-smoke "$tag"
            docker push "$tag"
            test -n "$first" || first="$tag"
          done <<< "$TAGS"
          test -n "$first"
          reference=$(docker image inspect "$first" --format '{{index .RepoDigests 0}}')
          echo "digest=${reference##*@}" >> "$GITHUB_OUTPUT"
          echo "repository=${reference%@*}" >> "$GITHUB_OUTPUT"
      - name: Attest published image digest
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ steps.push.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest tested image SBOM
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: system-sbom.json
          push-to-registry: true
