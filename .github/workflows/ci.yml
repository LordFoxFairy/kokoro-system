name: kokoro-system

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kokoro_system
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kokoro_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d kokoro_system"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=30
      redis:
        image: redis:7
        ports:
          - 56379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=15
    env:
      DATABASE_URL: postgresql://postgres:kokoro_ci@127.0.0.1:55432/kokoro_system
      REDIS_URL: redis://127.0.0.1:56379
      TEST_DATABASE_URL: postgresql://postgres:kokoro_ci@127.0.0.1:55432/kokoro_system
      TEST_REDIS_URL: redis://127.0.0.1:56379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:apply-schema
      - run: pnpm verify
      - run: pnpm test:runtime-real-system
      - run: pnpm test:integration
      - name: Scan source, dependencies, and secrets
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - run: docker build --tag kokoro-system:ci .
